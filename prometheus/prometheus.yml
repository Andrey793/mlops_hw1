global:
  scrape_interval: 2s        
  evaluation_interval: 5s    

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: ml-scorer
    static_configs:
      - targets: ['fraud_detector:8080']  

  - job_name: writer
    static_configs:
      - targets: ['writer:8081']  