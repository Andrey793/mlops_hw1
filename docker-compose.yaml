x-airflow-common: &airflow-common
  image: hw1-airflow:local
  pull_policy: never
  networks:
      - ml-scorer
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__FERNET_KEY: ""
    AIRFLOW__API_AUTH__JWT_SECRET: ${JWT_SECRET}
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    MODEL_DIR: /models
    TRAINING_DATA_DIR: /training_data
    BATCH_DATA_DIR: /batch_data
    POSTGRES_HOST: ${POSTGRES_HOST}
    POSTGRES_PORT: ${POSTGRES_PORT}
    POSTGRES_DB: ${POSTGRES_DB}
    POSTGRES_USER: ${POSTGRES_USER}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    PYTHONPATH: /opt/airflow/
    REPORT_DIR: /opt/airflow/report

  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ./config:/opt/airflow/config
    - ./pipeline:/opt/airflow/pipeline
    - models:/models
    - training_data:/training_data
    - batch_data:/batch_data
    - ./shared:/opt/airflow/shared:ro
    - ./report:/opt/airflow/report

  user: "${AIRFLOW_UID:-50000}:0"
  depends_on: &airflow-common-depends-on
    airflow-postgres:
      condition: service_healthy

services:
  kafka:
    image: apache/kafka:4.0.0
    container_name: kafka
    networks:
      - ml-scorer
    ports:
      - "9092:9092"              
    environment:
      KAFKA_NODE_ID: 1                              
      KAFKA_PROCESS_ROLES: broker,controller         
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093   
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER    
      
      
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0     

    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka-setup:
    image: apache/kafka:4.0.0     
    networks:
      - ml-scorer           
    depends_on:
      kafka:
        condition: service_healthy         
    entrypoint: ["/bin/sh", "-c"]            
    command:
      - |
        set -e
        echo 'Ожидание готовности Kafka...'
        while ! /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --list; do
          sleep 1
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 \
          --create --if-not-exists \
          --topic transactions \
          --partitions 1 \
          --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 \
          --create --if-not-exists \
          --topic scoring \
          --partitions 1 \
          --replication-factor 1
  
  # Сервис для удобного просмотра топиков и настройки kafka
  kafka-ui:
    image: kafbat/kafka-ui:b0fa145
    depends_on:
      - kafka
    networks:
      - ml-scorer
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
      DYNAMIC_CONFIG_ENABLED: "true"

  fraud_detector:
    build: ./fraud_detector
    networks:
      - ml-scorer
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka:19092"
      KAFKA_TRANSACTIONS_TOPIC: "transactions"
      KAFKA_SCORING_TOPIC: "scoring"
      MODEL_PATH: /app/models/model.cbm
      PYTHONPATH: /app
    volumes:
      - models:/app/models
      - ./shared:/app/shared:ro
    depends_on:
      kafka-setup:
        condition: service_completed_successfully
    restart: unless-stopped



  # interface:
  #   build: ./interface
  #   networks:
  #     - ml-scorer
  #   environment:
  #     KAFKA_BROKERS: "kafka:19092"  # Используем внутренний адрес Kafka
  #     KAFKA_TOPIC: "transactions"
  #     DATABASE_URL: postgresql://writer:pass@postgres:5432/scoring
  #   depends_on:
  #     - writer
  #   ports:
  #     - "8501:8501"

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    networks:
      - ml-scorer
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  writer:
    build: ./writer
    networks:
    - ml-scorer
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka:19092"
      KAFKA_SCORING_TOPIC: "scoring"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      kafka:
        condition: service_healthy
      kafka-setup:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: unless-stopped

  transaction_simulator:
    build: ./transaction_simulator
    networks:
      - ml-scorer
    environment:
      KAFKA_BROKERS: "kafka:19092"
      KAFKA_TOPIC: "transactions"
      TRANSACTIONS_CSV_PATH: /data/train.csv
      SEND_INTERVAL_SECONDS: "0.1"
    volumes:
      - ${TRAIN_DATA_CSV}:/data/train.csv:ro
    depends_on:
      kafka:
        condition: service_healthy
      kafka-setup:
        condition: service_completed_successfully
    restart: unless-stopped


  data_loader:
    build: ./data_loader
    networks:
      - ml-scorer
    env_file:
      - .env
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      LABELED_CSV_PATH: /data/train.csv
    volumes:
      - ${TRAIN_DATA_CSV}:/data/train.csv:ro
      - training_data:/training_data
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  airflow-postgres:
    image: postgres:16
    networks:
      - ml-scorer
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  airflow-init:
    <<: *airflow-common
    build: ./airflow
    pull_policy: build
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        mkdir -p /opt/airflow/{logs,dags,plugins,config}
        chown -R "${AIRFLOW_UID:-50000}:0" /models /batch_data /training_data /opt/airflow/{logs,dags,plugins,config,report}
        /entrypoint airflow version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: airflow
      _AIRFLOW_WWW_USER_PASSWORD: airflow
    user: "0:0"

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
      data_loader:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  report:
    image: nginx:1.27-alpine
    volumes:
      - ./report:/usr/share/nginx/html
    ports:
      - "8090:80"
    networks:
      - ml-scorer
    restart: unless-stopped
    command:
      - sh
      - -c
      - |
        cat > /usr/share/nginx/html/index.html <<'EOF'
        <!doctype html><html><head><meta charset="utf-8">
        <meta http-equiv="refresh" content="30"><title>Data Quality</title></head>
        <body><h1>Data Quality: labeled_transactions</h1>
        <p>Проверки ещё не запускались.</p></body></html>
        EOF
        exec nginx -g 'daemon off;'



    
networks:
  ml-scorer:
    name: ml-scorer
    driver: bridge

volumes:
  models:
  postgres_data:
  training_data:
  airflow-postgres-data:
  batch_data: